<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E5 洛伦兹力混合小测</title><link rel="stylesheet" href="assets/electric.css"></head><body><header class="hero"><div class="w"><h1>E5 洛伦兹力混合小测</h1><p>不标模型 · 分节点反馈</p></div></header><main class="w"><section class="c" id="quiz"></section><section class="c"><button class="btn" id="submit">提交</button><div id="result"></div><h2>下一步计划</h2><div class="plan" id="plan">完成后生成。</div><a href="electric.html">返回总中心</a></section></main><script>const qs=[['正电荷v向右、B向里，F方向？', ['向上', '向下', '向右'], 0, '方向'], ['磁场圆周半径正比于？', ['v', '1/v', 'q'], 0, '半径'], ['周期与速度关系？', ['正比', '反比', '无关'], 2, '周期'], ['找圆心常用？', ['弦垂直平分线', '切线', '随意'], 0, '几何'], ['等效电流先求？', ['周期', '半径', '电势'], 0, '电流'], ['速度选择不偏转满足？', ['qE=qvB', 'qE=mv²/r', 'E=0'], 0, '选择']],k='e5-test';quiz.innerHTML=qs.map((q,i)=>`<div class="m"><b>${i+1}. ${q[0]}</b>${q[1].map((x,j)=>`<label><input type=radio name=q${i} value=${j}>${x}</label>`).join('')}</div>`).join('');submit.onclick=()=>{let n={},score=0;qs.forEach((q,i)=>{n[q[3]]??=[0,0];n[q[3]][1]++;let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2]){n[q[3]][0]++;score++}});let weak=Object.entries(n).filter(x=>x[1][0]/x[1][1]<.8).map(x=>x[0]);localStorage.setItem(k,JSON.stringify({score,n,weak,date:new Date().toISOString()}));result.innerHTML=`<h2>${score}/${qs.length}</h2>`;plan.textContent=weak.length?'只回补：'+weak.join('、'):'本轮达标；安排1/3/7天新题复测。'};</script></body></html>
