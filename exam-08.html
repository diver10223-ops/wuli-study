<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第8题修复</title><style>body{background:#f4f7fb;font:16px/1.7 sans-serif;color:#172033}.w{max-width:780px;margin:auto}.c{background:#fff;margin:15px;padding:20px;border-radius:14px;border:1px solid #dbe4ef}.tip{background:#eef2ff;padding:12px}.task{display:block;padding:8px}.btn{background:#1d4ed8;color:#fff;border:0;padding:10px 15px;border-radius:9px}a{color:#1d4ed8}</style></head><body><main class="w"><section class="c"><h1>第8题修复：安培力、做功与动能</h1><div class="tip">先判F方向，再与位移比较得到功的正负，最后用动能定理判断动能变化。</div><label class="task"><input class="t" type="checkbox">我先画I、B、F</label><label class="task"><input class="t" type="checkbox">我比较F和位移夹角</label><label class="task"><input class="t" type="checkbox">我用合功判断ΔEk</label></section><section class="c"><h2>变式</h2><p>若安培力大小恒为4N，物体沿力方向移动3m，其他力不做功，则安培力做功12J，动能增加12J。</p><button class="btn" id="save">保存</button><p id="out"></p><p><a href="e4-test.html">返回E4小测</a></p></section></main><script>const k='exam08';document.querySelectorAll('.t').forEach((x,i)=>x.checked=(JSON.parse(localStorage.getItem(k)||'[]'))[i]||false);save.onclick=()=>{let a=[...document.querySelectorAll('.t')].map(x=>x.checked);localStorage.setItem(k,JSON.stringify(a));out.textContent=a.every(Boolean)?'完成；下一步做方向改变的变式。':'按受力—功—动能顺序补齐。'}</script></body></html>
