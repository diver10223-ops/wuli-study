<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10题修复</title><style>body{background:#f4f7fb;font:16px/1.7 sans-serif;color:#172033}.w{max-width:780px;margin:auto}.c{background:#fff;margin:15px;padding:20px;border-radius:14px;border:1px solid #dbe4ef}.tip{background:#eef2ff;padding:12px}.task{display:block;padding:8px}.btn{background:#1d4ed8;color:#fff;border:0;padding:10px 15px;border-radius:9px}a{color:#1d4ed8}</style></head><body><main class="w"><section class="c"><h1>第10题修复：霍尔效应</h1><div class="tip">载流子运动→磁力横向偏转→两侧电荷积累→形成霍尔电场→稳态时qE与qvB平衡。</div><label class="task"><input class="t" type="checkbox">我先判断载流子电性和速度</label><label class="task"><input class="t" type="checkbox">我能判断磁力与电荷积累侧</label><label class="task"><input class="t" type="checkbox">我能由电场方向判断电势高低</label></section><section class="c"><h2>反向变式</h2><p>保持电流和载流子不变，只反转磁场：磁力、积累电荷和霍尔电压极性均反转。</p><button class="btn" id="save">保存</button><p id="out"></p><p><a href="e4-test.html">返回E4小测</a></p></section></main><script>const k='exam10';document.querySelectorAll('.t').forEach((x,i)=>x.checked=(JSON.parse(localStorage.getItem(k)||'[]'))[i]||false);save.onclick=()=>{let a=[...document.querySelectorAll('.t')].map(x=>x.checked);localStorage.setItem(k,JSON.stringify(a));out.textContent=a.every(Boolean)?'完成；下一步改变载流子电性做3天复测。':'按载流子—磁力—电场—电势顺序补齐。'}</script></body></html>
