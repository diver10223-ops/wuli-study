<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E1静电场 B轨准入诊断</title><link rel="stylesheet" href="assets/electric.css"></head>
<body>
  <header class="hero"><div class="w"><h1>E1静电场 · B轨准入诊断</h1><p>10题 · 20分钟 · 支持A通过后进入或直接诊断进入</p></div></header>
  <main class="w">
    <section class="c notice"><h2>准入规则</h2><p>本诊断只检查拓展学习所需前置能力，不是B轨正式考卷。至少答对7题，并通过矢量叠加、符号与能量、电容器状态三个基础门槛。</p></section>
    <section class="c" id="quiz"></section>
    <section class="c actions"><button class="btn" id="submit" type="button">提交B准入诊断</button><button class="btn secondary" id="reset" type="button">清空重做</button></section>
    <section class="c" id="result" hidden></section>
    <section class="c"><h2>下一步计划</h2><div class="plan" id="plan">提交后生成B轨准入或A节点回补路线。</div><p><a href="e1.html">← 返回E1入口</a></p></section>
  </main>
  <script>
    const questions=[
      {id:'E1BD01',node:'E1-K03',gate:'矢量叠加',text:'两个场源在某点产生的场强大小相等。判断合场强前还必须知道？',options:['两个场强方向','检验电荷质量','该点电势零点'],answer:0},
      {id:'E1BD02',node:'E1-K06',gate:'符号与能量',text:'负电荷由低电势点到高电势点，正确的是？',options:['电势能减小、电场力做正功','电势能增大、电场力做负功','与电荷符号无关'],answer:0},
      {id:'E1BD03',node:'E1-K09',gate:'电容器状态',text:'电容器动态题中，决定先保持Q还是U的首要信息是？',options:['是否仍连接理想电源','极板颜色','电荷是正还是负'],answer:0},
      {id:'E1BD04',node:'E1-K02/K03',text:'寻找两个同号点电荷连线上的零场点时，正确方法是？',options:['先确定两场强反向的区域，再比较大小','只令两个场强大小相等','零场点一定在连线中点'],answer:0},
      {id:'E1BD05',node:'E1-K04/K05',text:'φ-x图像某区间下降，能直接得到的定性信息是？',options:['电势沿x方向降低；场方向还需结合场与势关系','正电荷一定向+x运动','场强处处相同'],answer:0},
      {id:'E1BD06',node:'E1-K06',text:'多阶段电场题中，电场力和外力都做功，最稳妥的能量处理是？',options:['先定义系统和阶段，分别记功与能量变化','只计算电场力功','默认机械能守恒'],answer:0},
      {id:'E1BD07',node:'E1-K09',text:'断电平行板电容器改变板距时，分析能量变化还应考虑？',options:['外力是否做功及场能变化','电源始终维持U','Q和U同时不变'],answer:0},
      {id:'E1BD08',node:'E1-K10',text:'带电粒子依次经过两个电场区域，正确做法是？',options:['按区域分段，每段重新确认受力和初始状态','全程只用一个加速度','忽略区域边界'],answer:0},
      {id:'E1BD09',node:'E1-K10',text:'判断粒子是否撞到极板，需要比较？',options:['到达板端所需时间与达到极板边界的条件','只比较电荷量','只看末速度大小'],answer:0},
      {id:'E1BD10',node:'E1-K11',text:'评价静电装置方案时，可靠结论至少需要？',options:['说明物理机制、适用条件和可观察证据','只写用途','只引用一个公式'],answer:0}
    ];
    const key='physics-e1-b-diagnostic-v1',quiz=document.getElementById('quiz'),result=document.getElementById('result'),plan=document.getElementById('plan');
    quiz.innerHTML=questions.map((q,i)=>`<article class="question"><div class="question-meta"><span>${i+1}. B前置</span><code>${q.node}</code>${q.gate?`<strong>门槛：${q.gate}</strong>`:''}</div><h3>${q.text}</h3><div class="options">${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${j}"> <span>${o}</span></label>`).join('')}</div><div class="response-meta"><label>状态 <select data-state="${q.id}"><option value="">未选择</option><option>独立完成</option><option>猜测</option><option>不会</option></select></label></div></article>`).join('');
    function grade(){let correct=0;const weak=[],failedGates=[],answers={},states={};questions.forEach(q=>{const value=document.querySelector(`input[name="${q.id}"]:checked`)?.value??null;answers[q.id]=value;states[q.id]=document.querySelector(`[data-state="${q.id}"]`).value;const ok=value!==null&&Number(value)===q.answer;if(ok)correct++;else{weak.push(q.node);if(q.gate)failedGates.push(q.gate);}});const admitted=correct>=7&&!failedGates.length;const data={version:1,correct,total:10,admitted,weak:[...new Set(weak)],failedGates,answers,states,submittedAt:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(data));result.hidden=false;result.innerHTML=`<h2 class="${admitted?'pass':'fail'}">${correct}/10 · ${admitted?'可以进入B轨':'先精确回补'}</h2><p><strong>基础门槛：</strong>${failedGates.join('、')||'全部通过'}</p><p><strong>薄弱节点：</strong>${[...new Set(weak)].join('、')||'无'}</p>`;plan.innerHTML=admitted?'<strong>准入：</strong>进入B轨学习包，按诊断薄弱点调整七个任务的顺序。':`<strong>回补：</strong>${failedGates.join('、')||[...new Set(weak)].join('、')}。只完成对应A知识卡和模型后重测。`;if(admitted)result.innerHTML+='<p><a class="btn-link" href="e1-b.html">进入B轨拓展学习包</a></p>';result.scrollIntoView({behavior:'smooth'});}
    document.getElementById('submit').addEventListener('click',grade);document.getElementById('reset').addEventListener('click',()=>{localStorage.removeItem(key);document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('select').forEach(x=>x.value='');result.hidden=true;plan.textContent='提交后生成B轨准入或A节点回补路线。';});
  </script>
</body></html>
