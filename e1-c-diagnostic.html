<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E1静电场 C轨前置诊断</title><link rel="stylesheet" href="assets/electric.css"></head>
<body>
  <header class="hero"><div class="w"><h1>E1静电场 · C轨前置诊断</h1><p>强基/竞赛衔接/大学先修 · 10题 · 25分钟</p></div></header>
  <main class="w">
    <section class="c notice"><h2>准入与边界</h2><p>C轨不属于普通高考默认任务。正式准入需要E1 B轨当前通过、本诊断通过，并明确选择强基、竞赛衔接或大学先修目标。</p><ul><li>至少答对7题；</li><li>函数图像、模型假设、实验论证三个工具门槛必须通过；</li><li>C轨通过不会改变A/B和校内主线优先级。</li></ul><label><input id="goal" type="checkbox"> 我确认当前目标包含强基、竞赛衔接或大学先修。</label></section>
    <section class="c" id="quiz"></section>
    <section class="c actions"><button class="btn" id="submit" type="button">提交C前置诊断</button><button class="btn secondary" id="reset" type="button">清空重做</button></section>
    <section class="c" id="result" hidden></section>
    <section class="c"><h2>下一步计划</h2><div class="plan" id="plan">提交后分别判断B轨证据、工具准备和学习目标。</div><p><a href="e1.html">← 返回E1入口</a></p></section>
  </main>
  <script>
    const questions=[
      {id:'E1CD01',node:'E0-MATH',gate:'函数图像',text:'一维情形中，电势φ随x变化更快，意味着沿x方向的场强分量通常？',options:['绝对值更大，但方向要看φ增减','一定更小','与φ变化无关'],answer:0},
      {id:'E1CD02',node:'E1-K03',gate:'模型假设',text:'把离散电荷近似成连续分布前，必须说明？',options:['观察尺度、分布密度和近似适用范围','电荷不再量子化','每个电荷量变为零'],answer:0},
      {id:'E1CD03',node:'E1-K11',gate:'实验论证',text:'验证屏蔽效果时，可靠方案应？',options:['定义可测量量、对照条件和判据','只描述金属外壳','预先认定完全屏蔽'],answer:0},
      {id:'E1CD04',node:'E1-K03',text:'利用对称性求连续分布的场，首先应判断？',options:['哪些方向分量因对称抵消、哪些保留','总电荷一定集中在中心','场强一定处处相同'],answer:0},
      {id:'E1CD05',node:'E1-K04/K05',text:'若φ(x)在某点附近有极值，判断带电粒子稳定性还必须结合？',options:['电荷符号和势能qφ的局部形状','只看φ正负','只看粒子质量'],answer:0},
      {id:'E1CD06',node:'E1-K08/K09',text:'讨论电容器储能变化时，完整能量账本可能包含？',options:['场能、电源交换能量和外力功','只有Q和U','只有电容C'],answer:0},
      {id:'E1CD07',node:'E1-K08',text:'多个电容器等效时，为什么要先标节点和连接关系？',options:['串并联判断依赖节点约束','所有电容可直接相加','电势处处相同'],answer:0},
      {id:'E1CD08',node:'E1-K10',text:'推导粒子轨迹参数关系后，量纲检查的作用是？',options:['发现部分代数或模型错误，但不能证明结论一定正确','替代全部物理推导','决定粒子电性'],answer:0},
      {id:'E1CD09',node:'E1-K10',text:'参数极限分析的合理用途是？',options:['检验表达式在已知简单极限下是否合理','让所有参数取零','替代边界条件'],answer:0},
      {id:'E1CD10',node:'E1-K11',text:'可反驳的静电实验假设应能导出？',options:['可测量且可能被数据否定的预测','必然正确的口号','无需变量的结论'],answer:0}
    ];
    const key='physics-e1-c-diagnostic-v1',bExam=JSON.parse(localStorage.getItem('physics-e1-b-exam-v1')||'null');
    const quiz=document.getElementById('quiz'),result=document.getElementById('result'),plan=document.getElementById('plan'),goal=document.getElementById('goal');
    quiz.innerHTML=questions.map((q,i)=>`<article class="question"><div class="question-meta"><span>${i+1}. C前置</span><code>${q.node}</code>${q.gate?`<strong>门槛：${q.gate}</strong>`:''}</div><h3>${q.text}</h3><div class="options">${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${j}"> <span>${o}</span></label>`).join('')}</div><div class="response-meta"><label>状态 <select data-state="${q.id}"><option value="">未选择</option><option>独立完成</option><option>猜测</option><option>不会</option></select></label></div></article>`).join('');
    function grade(){let correct=0;const weak=[],failedGates=[],answers={},states={};questions.forEach(q=>{const value=document.querySelector(`input[name="${q.id}"]:checked`)?.value??null;answers[q.id]=value;states[q.id]=document.querySelector(`[data-state="${q.id}"]`).value;const ok=value!==null&&Number(value)===q.answer;if(ok)correct++;else{weak.push(q.node);if(q.gate)failedGates.push(q.gate);}});const toolsPassed=correct>=7&&!failedGates.length,bPassed=Boolean(bExam?.passed),goalConfirmed=goal.checked,admitted=toolsPassed&&bPassed&&goalConfirmed;const data={version:1,correct,total:10,toolsPassed,bPassed,goalConfirmed,admitted,weak:[...new Set(weak)],failedGates,answers,states,submittedAt:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(data));result.hidden=false;result.innerHTML=`<h2 class="${admitted?'pass':'fail'}">${correct}/10 · ${admitted?'C轨正式准入':'准入条件未齐'}</h2><div class="score-grid"><div><span>B轨证据</span><strong>${bPassed?'通过':'缺失'}</strong></div><div><span>工具诊断</span><strong>${toolsPassed?'通过':'回补'}</strong></div><div><span>强基目标</span><strong>${goalConfirmed?'确认':'未确认'}</strong></div></div><p><strong>失败门槛：</strong>${failedGates.join('、')||'无'}</p><p><strong>薄弱节点：</strong>${[...new Set(weak)].join('、')||'无'}</p>`;if(admitted){plan.innerHTML='<strong>下一步：</strong>进入C轨强基学习包。';result.innerHTML+='<p><a class="btn-link" href="e1-c.html">进入C轨学习包</a></p>';}else{const routes=[];if(!bPassed)routes.push('先取得E1 B轨通过证据');if(!toolsPassed)routes.push(`回补${failedGates.join('、')||[...new Set(weak)].join('、')}`);if(!goalConfirmed)routes.push('确认是否确实需要强基轨');plan.innerHTML=`<strong>准入前任务：</strong>${routes.join('；')}。可以预览C内容，但不能记录正式进度。`;}}
    document.getElementById('submit').addEventListener('click',grade);document.getElementById('reset').addEventListener('click',()=>{localStorage.removeItem(key);document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('select').forEach(x=>x.value='');result.hidden=true;plan.textContent='提交后分别判断B轨证据、工具准备和学习目标。';});
  </script>
</body></html>
