<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E7 交变电流混合小测</title><link rel="stylesheet" href="assets/electric.css"></head><body><header class="hero"><div class="w"><h1>E7 交变电流混合小测</h1><p>不标模型 · 分节点反馈</p></div></header><main class="w"><section class="c" id="quiz"></section><section class="c"><button class="btn" id="submit">提交</button><div id="result"></div><h2>下一步计划</h2><div class="plan" id="plan">完成后生成。</div><a href="electric.html">返回总中心</a></section></main><script>const qs=[['正弦交变电压有效值？', ['Um/√2', 'Um', '2Um'], 0, '有效值'], ['频率与周期？', ['f=T', 'f=1/T', 'f=2πT'], 1, '图像'], ['理想变压器电压比等于？', ['匝数比', '电阻比', '功率比'], 0, '变压器'], ['远距离输电升压目的？', ['减小电流和线损', '增大线损', '增大电阻'], 0, '输电'], ['电磁波传播是否需要介质？', ['需要', '不需要', '只需空气'], 1, '电磁波'], ['理想变压器输入输出功率？', ['近似相等', '输入为零', '输出更大'], 0, '变压器']],k='e7-test';quiz.innerHTML=qs.map((q,i)=>`<div class="m"><b>${i+1}. ${q[0]}</b>${q[1].map((x,j)=>`<label><input type=radio name=q${i} value=${j}>${x}</label>`).join('')}</div>`).join('');submit.onclick=()=>{let n={},score=0;qs.forEach((q,i)=>{n[q[3]]??=[0,0];n[q[3]][1]++;let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2]){n[q[3]][0]++;score++}});let weak=Object.entries(n).filter(x=>x[1][0]/x[1][1]<.8).map(x=>x[0]);localStorage.setItem(k,JSON.stringify({score,n,weak,date:new Date().toISOString()}));result.innerHTML=`<h2>${score}/${qs.length}</h2>`;plan.textContent=weak.length?'只回补：'+weak.join('、'):'本轮达标；安排1/3/7天新题复测。'};</script></body></html>
