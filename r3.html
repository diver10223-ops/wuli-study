<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电学R3 · 阶段出关</title><style>body{margin:0;background:#f3f6fb;color:#172033;font:16px/1.65 sans-serif}.w{max-width:900px;margin:auto}.hero{background:linear-gradient(135deg,#123b87,#2563eb);color:#fff;padding:28px 15px}.c{background:#fff;border:1px solid #dbe4ef;border-radius:14px;margin:15px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid #dbe4ef;border-radius:10px;padding:13px}.ok{color:#15803d}.warn{color:#b45309}.btn{display:inline-block;background:#1d4ed8;color:#fff;padding:11px 17px;border-radius:9px;text-decoration:none;font-weight:700}.plan{background:#eff6ff;border-left:4px solid #2563eb;padding:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="w"><h1>⚡ 电学 R3 · 阶段出关</h1><p>读取R2证据，完成综合限时卷，再决定出关或精确回补。</p></div></header><main class="w"><section class="c"><h2>准入检查</h2><div class="grid" id="evidence"></div></section><section class="c"><h2>出关标准</h2><ul><li>综合卷总分≥80%</li><li>概念、计算、图像、实验、表达任何单项不得低于60%</li><li>第16类支路对象错误不得复发</li><li>本次通过只标“阶段出关”，仍需7天后复测</li></ul><a class="btn" href="r3-exam.html">开始45分钟综合限时卷</a></section><section class="c"><h2>下一步计划</h2><div class="plan" id="plan">先完成综合限时卷。</div></section></main><script>const r2=JSON.parse(localStorage.getItem('electricR2')||'{}'),t=JSON.parse(localStorage.getItem('r2Test')||'{}'),e=JSON.parse(localStorage.getItem('r3Exam')||'{}');const rows=[['R2模型',(r2.done||[]).length+'/5'],['R2混测',t.score==null?'未完成':t.score+'/10'],['R3综合卷',e.score==null?'未完成':e.score+'/10']];evidence.innerHTML=rows.map(x=>`<div class=item><b>${x[0]}</b><p>${x[1]}</p></div>`).join('');plan.textContent=e.passed?'阶段出关已通过。下一步安排7天复测，再进入E4磁场与安培力。':e.score!=null?'尚未出关。只返回低于60%的能力节点，不重做整个R1/R2。':'现在做什么：完成R3综合限时卷并记录失分原因。';</script></body></html>
