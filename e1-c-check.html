<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E1静电场 C轨即时检测</title><link rel="stylesheet" href="assets/electric.css"></head>
<body>
  <header class="hero"><div class="w"><h1>E1静电场 · C轨即时检测</h1><p>8题 · 对应C01—C08 · 检查强基方法准备</p></div></header>
  <main class="w">
    <section class="c notice"><h2>规则</h2><p>须已完成C轨准入和学习包；至少答对6题才建议进入正式强基卷。即时检测只检查方法判断，不能替代书面推导和探究证据。</p></section>
    <section class="c" id="eligibility"></section><section class="c" id="quiz"></section>
    <section class="c actions"><button class="btn" id="submit" type="button">提交即时检测</button><button class="btn secondary" id="reset" type="button">清空重做</button></section>
    <section class="c" id="result" hidden></section>
    <section class="c"><h2>下一步计划</h2><div class="plan" id="plan">提交后精确返回C01—C08。</div><p><a href="e1-c.html">← 返回C轨学习包</a></p></section>
  </main>
  <script>
    const questions=[
      {id:'E1CC01',task:'C01',node:'E1-K01/K03',text:'将大量离散电荷近似为连续分布时，必须优先说明？',options:['观察尺度、密集程度和误差边界','电荷已不再离散','每个电荷量等于零'],answer:0},
      {id:'E1CC02',task:'C02',node:'E1-K03',text:'均匀带电圆环轴线上场强的横向分量为何抵消？',options:['关于轴成对微元的横向分量反向等大','每个微元场强为零','轴线上电势为零'],answer:0},
      {id:'E1CC03',task:'C03',node:'E1-K04/K05',text:'一维φ-x曲线在某点斜率为零，能够直接推出？',options:['该点沿x方向场强分量为零','总场强一定为零','粒子一定稳定'],answer:0},
      {id:'E1CC04',task:'C04',node:'E1-K05/K06',text:'同一电势极小点附近，正负电荷的稳定性为何可能不同？',options:['势能为qφ，电荷符号会改变势能曲线形状','质量不同','电势单位改变'],answer:0},
      {id:'E1CC05',task:'C05',node:'E1-K08/K09',text:'改变电容网络参数时，能量结论依赖的首要条件是？',options:['连接状态及电源是否交换能量','电容器颜色','始终只有场能变化'],answer:0},
      {id:'E1CC06',task:'C06',node:'E1-K10',text:'参数化推导后进行q→0或E→0极限检查，主要用于？',options:['检验表达式能否回到合理简单情形','替代原推导','证明所有假设正确'],answer:0},
      {id:'E1CC07',task:'C07',node:'E1-K11',text:'讨论金属外壳屏蔽效果时，不能省略？',options:['静电条件、结构、开口和接地等边界','金属颜色','外壳名称'],answer:0},
      {id:'E1CC08',task:'C08',node:'E1-K11',text:'可反驳探究方案最关键的特征是？',options:['给出可测预测和否定假设的判据','保证实验支持假设','只记录成功数据'],answer:0}
    ];
    const key='physics-e1-c-check-v1',diagnosis=JSON.parse(localStorage.getItem('physics-e1-c-diagnostic-v1')||'null'),learning=JSON.parse(localStorage.getItem('physics-e1-c-learning-v1')||'{}');
    const eligible=Boolean(diagnosis?.admitted)&&new Set(learning.done||[]).size===8,eligibility=document.getElementById('eligibility'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),plan=document.getElementById('plan'),submit=document.getElementById('submit');
    eligibility.innerHTML=eligible?'<h2 class="pass">学习证据齐全</h2><p>可以参加即时检测。</p>':'<h2 class="fail">学习证据未齐</h2><p>可以预览题目，但提交前应先完成C轨准入和8项学习任务。</p>';
    quiz.innerHTML=questions.map((q,i)=>`<article class="question"><div class="question-meta"><span>${q.task}</span><code>${q.node}</code></div><h3>${i+1}. ${q.text}</h3><div class="options">${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${j}"> <span>${o}</span></label>`).join('')}</div></article>`).join('');
    function grade(){let correct=0;const weak=[],answers={};questions.forEach(q=>{const value=document.querySelector(`input[name="${q.id}"]:checked`)?.value??null;answers[q.id]=value;if(value!==null&&Number(value)===q.answer)correct++;else weak.push({task:q.task,node:q.node});});const passed=eligible&&correct>=6;localStorage.setItem(key,JSON.stringify({version:1,eligible,correct,total:8,passed,weak,answers,submittedAt:new Date().toISOString()}));result.hidden=false;result.innerHTML=`<h2 class="${passed?'pass':'fail'}">${correct}/8 · ${passed?'可以进入C强基卷':eligible?'先回补C任务':'学习证据未齐'}</h2><p><strong>待回补：</strong>${weak.map(x=>`${x.task}（${x.node}）`).join('、')||'无'}</p>`;plan.innerHTML=passed?'<strong>下一步：</strong>进入正式C强基卷，准备纸笔推导和探究原稿。':eligible?`<strong>下一步：</strong>返回${weak.map(x=>x.task).join('、')}后重测。`:'<strong>下一步：</strong>先完成准入和学习包，当前成绩不作为正式证据。';if(passed)result.innerHTML+='<p><a class="btn-link" href="e1-c-exam.html">参加C轨强基卷</a></p>';result.scrollIntoView({behavior:'smooth'});}
    submit.addEventListener('click',grade);document.getElementById('reset').addEventListener('click',()=>{localStorage.removeItem(key);document.querySelectorAll('input').forEach(x=>x.checked=false);result.hidden=true;plan.textContent='提交后精确返回C01—C08。';});
  </script>
</body></html>
