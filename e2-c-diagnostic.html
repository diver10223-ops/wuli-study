<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E2/E3 C轨前置诊断</title><link rel="stylesheet" href="assets/electric.css"></head>
<body>
  <header class="hero"><div class="w"><h1>E2/E3 · C轨前置诊断</h1><p>强基与大学先修方向 · 10题 · 25分钟</p></div></header>
  <main class="w">
    <section class="c notice">
      <h2>边界与准入</h2>
      <p>C轨不属于普通高考默认提分任务，也不会被标记为“北京必考”。正式准入需要两类证据：B轨当前通过，以及本诊断通过。</p>
      <ul><li>诊断至少答对7题；</li><li>代数图像、模型假设、测量误差三个工具门槛必须答对；</li><li>需要明确选择强基、竞赛衔接或大学先修目标。</li></ul>
      <label><input id="goal" type="checkbox"> 我确认当前目标包含强基、竞赛衔接或大学先修，而不只是普通高考提分。</label>
    </section>
    <section class="c" id="quiz"></section>
    <section class="c actions"><button class="btn" id="submit" type="button">提交C轨诊断</button><button class="btn secondary" id="reset" type="button">清空重做</button></section>
    <section class="c" id="result" hidden></section>
    <section class="c"><h2>下一步计划</h2><div class="plan" id="plan">提交后分别判断B轨证据、工具准备和学习目标。</div><p><a href="e2-tracks.html">← 返回三轨入口</a></p></section>
  </main>
  <script>
    const questions=[
      {id:'CD01',node:'E0-ALG',gate:'代数图像',text:'若U=E-Ir，在U-I图中改变横纵轴顺序后，斜率的物理意义会怎样？',options:['保持不变','随方程表达和坐标轴改变，必须重新推导','只改变正负号且无需单位'],answer:1},
      {id:'CD02',node:'E2-K07',gate:'模型假设',text:'使用I=E/(R+r)时隐含的核心前提之一是？',options:['外电路可以用确定的等效电阻描述且电源模型适用','任何非线性元件都可直接用恒定R代替','电流必须为整数'],answer:0},
      {id:'CD03',node:'E3-K03',gate:'测量误差',text:'电压表内阻有限会影响待测电路，正确理解是？',options:['电压表是完全不取电流的理想元件','接入仪表改变了系统，需要把仪表纳入电路模型','只要读数有小数就没有误差'],answer:1},
      {id:'CD04',node:'E2-K06',text:'对一个复杂电阻网络，写节点电流关系前应先做什么？',options:['定义节点和各支路电流方向','直接把所有电阻相加','假设所有支路电流相等'],answer:0},
      {id:'CD05',node:'E2-K09',text:'讨论负载获得最大功率时，为什么必须同时说明约束条件？',options:['极值结论依赖电源模型、可调参数和研究对象','任何电路的最大功率条件都完全相同','约束只影响单位'],answer:0},
      {id:'CD06',node:'E2-K04',text:'非线性元件某工作点附近的变化关系，为什么不能简单等同U/I？',options:['工作点附近变化率与从原点到工作点的比值不是同一概念','因为U/I永远没有意义','因为非线性元件没有电压'],answer:0},
      {id:'CD07',node:'E3-K06',text:'用多组数据估计E和r，相比只用两点，主要优势是？',options:['可以观察离散、异常点和整体趋势，降低偶然读数影响','一定消除所有系统误差','不再需要物理模型'],answer:0},
      {id:'CD08',node:'E3-K01',text:'“测量值保留更多小数就更准确”为什么不成立？',options:['有效位数应受仪器分辨率和不确定度约束','小数越多单位会改变','整数永远最准'],answer:0},
      {id:'CD09',node:'E3-K07',text:'设计探究实验时，可检验假设必须具备什么特点？',options:['能够导出可测量、可反驳的预测','结论必须预先确定为正确','不需要控制或记录条件'],answer:0},
      {id:'CD10',node:'E2-K10',text:'两个不同故障模型给出相同观测结果，下一步应？',options:['设计能区分两模型预测的新测量','任选一个结论','重复写原观测'],answer:0}
    ];
    const key='physics-e2e3-c-diagnostic-v1',bExam=JSON.parse(localStorage.getItem('physics-e2e3-b-exam-v1')||'null');
    const quiz=document.getElementById('quiz'),result=document.getElementById('result'),plan=document.getElementById('plan'),goal=document.getElementById('goal');
    quiz.innerHTML=questions.map((q,i)=>`<article class="question"><div class="question-meta"><span>${i+1}. 前置工具</span><code>${q.node}</code>${q.gate?`<strong>门槛：${q.gate}</strong>`:''}</div><h3>${q.text}</h3><div class="options">${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${j}"> <span>${o}</span></label>`).join('')}</div><div class="response-meta"><label>状态 <select data-state="${q.id}"><option value="">未选择</option><option>独立完成</option><option>猜测</option><option>不会</option></select></label></div></article>`).join('');
    function grade(){let correct=0;const weak=[],failedGates=[],states={},answers={};questions.forEach(q=>{const value=document.querySelector(`input[name="${q.id}"]:checked`)?.value??null;answers[q.id]=value;states[q.id]=document.querySelector(`[data-state="${q.id}"]`).value;const ok=value!==null&&Number(value)===q.answer;if(ok)correct++;else{weak.push(q.node);if(q.gate)failedGates.push(q.gate);}});const toolsPassed=correct>=7&&!failedGates.length,goalConfirmed=goal.checked,bPassed=Boolean(bExam?.passed),admitted=toolsPassed&&goalConfirmed&&bPassed;const data={version:1,correct,total:10,toolsPassed,goalConfirmed,bPassed,admitted,weak:[...new Set(weak)],failedGates,answers,states,submittedAt:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(data));result.hidden=false;result.innerHTML=`<h2 class="${admitted?'pass':'fail'}">${correct}/10 · ${admitted?'C轨准入完成':'准入条件未全部满足'}</h2><div class="score-grid"><div><span>B轨证据</span><strong>${bPassed?'通过':'缺失'}</strong></div><div><span>工具诊断</span><strong>${toolsPassed?'通过':'回补'}</strong></div><div><span>强基目标</span><strong>${goalConfirmed?'确认':'未确认'}</strong></div></div><p><strong>失败门槛：</strong>${failedGates.join('、')||'无'}</p><p><strong>薄弱节点：</strong>${[...new Set(weak)].join('、')||'无'}</p>`;if(admitted){plan.innerHTML='<strong>下一步：</strong>进入C轨强基学习包，从模型假设与节点方法开始。';result.innerHTML+='<p><a class="btn-link" href="e2-c.html">进入C轨学习包</a></p>';}else{const routes=[];if(!bPassed)routes.push('先完成B拓展卷或补齐B轨稳定证据');if(!toolsPassed)routes.push(`回补${failedGates.join('、')||[...new Set(weak)].join('、')}`);if(!goalConfirmed)routes.push('确认是否确实需要强基轨');plan.innerHTML=`<strong>准入前任务：</strong>${routes.join('；')}。可以预览C轨，但不能标记正式开始。`;}}
    document.getElementById('submit').addEventListener('click',grade);document.getElementById('reset').addEventListener('click',()=>{localStorage.removeItem(key);document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('select').forEach(x=>x.value='');result.hidden=true;plan.textContent='提交后分别判断B轨证据、工具准备和学习目标。';});
  </script>
</body></html>
