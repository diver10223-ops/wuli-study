<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R3电路与实验综合限时卷</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:16px/1.65 sans-serif}.w{max-width:880px;margin:auto}.hero{background:#173f91;color:#fff;padding:24px 15px;position:sticky;top:0;z-index:3}.time{float:right}.c{background:#fff;border:1px solid #dce4ef;border-radius:14px;margin:15px;padding:20px}.q{padding:15px 0;border-bottom:1px solid #e2e8f0}label{display:block;padding:5px}.reason{margin-top:8px}.btn{border:0;border-radius:9px;background:#1d4ed8;color:#fff;padding:11px 17px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.node{border:1px solid #dce4ef;border-radius:9px;padding:10px;text-align:center}.bad{color:#b91c1c}.good{color:#15803d}.plan{background:#eff6ff;border-left:4px solid #2563eb;padding:13px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="hero"><div class="w"><span class="time" id="timer">45:00</span><h1>R3 综合限时卷</h1><p>不标模型 · 10题 · 每题记录失分类型</p></div></header><main class="w"><section class="c" id="quiz"></section><section class="c"><button class="btn" id="submit">提交并判定出关</button><div id="result"></div></section><section class="c"><h2>下一步计划</h2><div class="plan" id="plan">完成全部题目后生成。</div><p><a href="r3.html">← 返回R3中心</a></p></section></main><script>
const qs=[['电路中有电源但开关断开，是否有持续电流？',['有','没有'],1,'概念'],['并联端电压6V，6Ω支路电流？',['1A','2A','6A'],0,'计算'],['电源E=6V,r=1Ω,R=5Ω，路端电压？',['1V','5V','6V'],1,'计算'],['U-I图纵截距和斜率绝对值？',['E与r','r与E','功率与效率'],0,'图像'],['动态电路第一步应判断？',['电表示数','等效电阻','功率'],1,'概念'],['电动机U=6V,IM=2A,r=1Ω，机械功率？',['8W','12W','4W'],0,'计算'],['欧姆挡换挡后应？',['直接测','重新欧姆调零','机械调零'],1,'实验'],['测E和r图像斜率应写？',['数值即可','数值、符号、单位和物理意义','只写单位'],1,'实验'],['计算电动机功率前最重要的表达是？',['写明IM属于电动机支路','先算总电阻','先写答案'],0,'表达'],['并联干路3A，电阻支路1A，电动机电流？',['1A','2A','3A'],1,'表达']];let sec=2700,finished=false;quiz.innerHTML=qs.map((q,i)=>`<div class=q><b>${i+1}. ${q[0]}</b>${q[1].map((x,j)=>`<label><input type=radio name=q${i} value=${j}>${x}</label>`).join('')}<select class=reason data-i=${i}><option>本题状态</option><option>独立完成</option><option>不会</option><option>来不及</option><option>会但做错</option><option>表达不完整</option></select></div>`).join('');setInterval(()=>{if(finished||sec<=0)return;sec--;timer.textContent=`${String(sec/60|0).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`},1000);submit.onclick=()=>{finished=true;let nodes={},score=0,branchError=false;qs.forEach((q,i)=>{nodes[q[3]]??=[0,0];nodes[q[3]][1]++;let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2]){nodes[q[3]][0]++;score++}if(i===9&&(!a||+a.value!==q[2]))branchError=true});let low=Object.entries(nodes).filter(x=>x[1][0]/x[1][1]<.6).map(x=>x[0]),passed=score>=8&&!low.length&&!branchError;let reasons=[...document.querySelectorAll('.reason')].map(x=>x.value);localStorage.setItem('r3Exam',JSON.stringify({score,nodes,low,branchError,passed,reasons,secondsUsed:2700-sec,date:new Date().toISOString()}));result.innerHTML=`<h2 class=${passed?'good':'bad'}>${score}/10 · ${passed?'阶段出关':'暂未出关'}</h2><div class=grid>${Object.entries(nodes).map(x=>`<div class=node>${x[0]}<br><b>${x[1][0]}/${x[1][1]}</b></div>`).join('')}</div>`;plan.innerHTML=passed?'下一步：7天后用新题复测；通过后进入E4磁场与安培力。':branchError?'第16类支路错误复发：返回M04和第16题闭环，3天后重测。':`只回补低于60%的节点：<b>${low.join('、')||'总分未达线'}</b>。`;};</script></body></html>
