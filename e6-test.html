<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E6 电磁感应混合小测</title><link rel="stylesheet" href="assets/electric.css"></head><body><header class="hero"><div class="w"><h1>E6 电磁感应混合小测</h1><p>不标模型 · 分节点反馈</p></div></header><main class="w"><section class="c" id="quiz"></section><section class="c"><button class="btn" id="submit">提交</button><div id="result"></div><h2>下一步计划</h2><div class="plan" id="plan">完成后生成。</div><a href="electric.html">返回总中心</a></section></main><script>const qs=[['产生感应电流需要？', ['磁场存在', '闭合回路磁通变化', '导体运动'], 1, '条件'], ['楞次定律描述？', ['大小', '阻碍磁通变化', '电阻'], 1, '方向'], ['法拉第定律核心量？', ['磁通变化率', '磁场大小', '电流'], 0, '大小'], ['BLv使用需检查？', ['相互方向与有效长度', '电阻率', '质量'], 0, '切割'], ['磁场对运动导体棒可通过什么改变能量？', ['安培力做功', '洛伦兹力对单电荷做功', '质量'], 0, '综合'], ['磁通量单位？', ['Wb', 'T', 'A'], 0, '磁通']],k='e6-test';quiz.innerHTML=qs.map((q,i)=>`<div class="m"><b>${i+1}. ${q[0]}</b>${q[1].map((x,j)=>`<label><input type=radio name=q${i} value=${j}>${x}</label>`).join('')}</div>`).join('');submit.onclick=()=>{let n={},score=0;qs.forEach((q,i)=>{n[q[3]]??=[0,0];n[q[3]][1]++;let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2]){n[q[3]][0]++;score++}});let weak=Object.entries(n).filter(x=>x[1][0]/x[1][1]<.8).map(x=>x[0]);localStorage.setItem(k,JSON.stringify({score,n,weak,date:new Date().toISOString()}));result.innerHTML=`<h2>${score}/${qs.length}</h2>`;plan.textContent=weak.length?'只回补：'+weak.join('、'):'本轮达标；安排1/3/7天新题复测。'};</script></body></html>
