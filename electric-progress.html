<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电学E4—E8总进度</title><link rel="stylesheet" href="assets/electric.css"></head><body><header class="hero"><div class="w"><h1>电学E4—E8总进度</h1><p>模块 · 轨道 · 正式卷 · 间隔复测 · 本机证据</p></div></header><main class="w"><section class="c notice"><p>只读取当前浏览器本地记录，不上传数据。模块“稳定”要求目标轨正式卷和复测均通过。</p><button class="btn" id="export">导出全电学证据</button><span id="state"></span></section><section class="c grid" id="modules"></section><section class="c"><div class="plan" id="plan"></div><p><a href="electric.html">← 返回电学中心</a></p></section></main><script>
const modules=[['E4','磁场与安培力'],['E5','洛伦兹力与带电粒子'],['E6','电磁感应'],['E7','交变电流与电磁波'],['E8','电磁综合']],tracks=['a','b','c'];function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}const keys=[];document.getElementById('modules').innerHTML=modules.map(([m,n])=>{const lo=m.toLowerCase(),rows=tracks.map(t=>{const e=`physics-${lo}-${t}-exam-v1`,r=`physics-${lo}-${t}-retest-v1`;keys.push(e,r);const ep=read(e)?.passed===true,rp=read(r)?.passed===true;return `<li>${t.toUpperCase()}轨：正式卷${ep?'通过':'未通过'}；复测${rp?'通过':'未通过'}</li>`}).join('');return `<article class="m"><h2>${m} ${n}</h2><ul>${rows}</ul><a href="${lo}-progress.html">模块进度</a></article>`}).join('');const passed=keys.filter(k=>read(k)?.passed===true).length;document.getElementById('plan').innerHTML=`当前${passed}/${keys.length}项正式卷/复测证据通过。未通过项按模块进度页精确回补。`;document.getElementById('export').onclick=()=>{const payload={schema:'wuli-study/electric-progress',version:1,exportedAt:new Date().toISOString(),records:Object.fromEntries(keys.map(k=>[k,read(k)]))},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`electric-progress-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);document.getElementById('state').textContent='已导出'};</script></body></html>
