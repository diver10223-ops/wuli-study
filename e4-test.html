<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E4磁场与安培力混合小测</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:16px/1.6 sans-serif}.w{max-width:860px;margin:auto}.hero{background:#3730a3;color:#fff;padding:25px 15px}.c{background:#fff;border:1px solid #dbe4ef;border-radius:14px;margin:15px;padding:19px}.q{padding:14px 0;border-bottom:1px solid #e5e7eb}label{display:block;padding:5px}.btn{border:0;border-radius:9px;background:#1d4ed8;color:#fff;padding:10px 16px}.plan{background:#eef2ff;border-left:4px solid #4f46e5;padding:13px}a{color:#1d4ed8}</style></head><body><header class="hero"><div class="w"><h1>E4 磁场与安培力混合小测</h1><p>10题 · 不标模型 · 分节点诊断</p></div></header><main class="w"><section class="c" id="quiz"></section><section class="c"><button class="btn" id="submit">提交小测</button><div id="result"></div></section><section class="c"><h2>下一步计划</h2><div class="plan" id="plan">完成后生成精确修复与1/3/7天复测。</div><p><a href="e4.html">← 返回E4</a></p></section></main><script>
const qs=[['电流向上直导线右侧的磁场方向？',['纸内','纸外','向上'],0,'方向'],['判断安培力方向前应先确定？',['研究对象、I和B','电阻率','电源效率'],0,'方向'],['同向平行电流通常相互？',['吸引','排斥','无作用'],0,'叠加'],['平行导线问题可靠步骤？',['背结论','先求对方B，再判F','先求功率'],1,'叠加'],['F=BIL直接使用应检查？',['夹角和有效长度','导线颜色','电源内阻'],0,'大小'],['安培力与位移同向时做功？',['正','负','零'],0,'能量'],['安培力做正功时物体动能通常？',['增大','减小','不变'],0,'能量'],['霍尔电压源于？',['载流子横向偏转积累','焦耳热','断路'],0,'霍尔'],['霍尔稳态横向满足？',['电场力与磁力平衡','重力平衡','电流为零'],0,'霍尔'],['判断霍尔板电势高低还必须知道？',['载流子电性','电阻长度','电源内阻'],0,'霍尔']];const k='e4Test';quiz.innerHTML=qs.map((q,i)=>`<div class=q><b>${i+1}. ${q[0]}</b>${q[1].map((x,j)=>`<label><input type=radio name=q${i} value=${j}>${x}</label>`).join('')}<select class=why><option>独立完成</option><option>不会</option><option>猜测</option><option>会但做错</option></select></div>`).join('');submit.onclick=()=>{let n={},score=0;qs.forEach((q,i)=>{n[q[3]]??=[0,0];n[q[3]][1]++;let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2]){n[q[3]][0]++;score++}});let weak=Object.entries(n).filter(x=>x[1][0]/x[1][1]<.8).map(x=>x[0]),d=x=>new Date(Date.now()+x*864e5).toLocaleDateString();localStorage.setItem(k,JSON.stringify({score,n,weak,reviews:[d(1),d(3),d(7)],states:[...document.querySelectorAll('.why')].map(x=>x.value)}));result.innerHTML=`<h2>${score}/10</h2>${Object.entries(n).map(x=>`<p>${x[0]}：${x[1][0]}/${x[1][1]}</p>`).join('')}<p>复测：${d(1)}、${d(3)}、${d(7)}</p>`;let links={叠加:'exam-03.html',能量:'exam-08.html',霍尔:'exam-10.html'};plan.innerHTML=weak.length?`先修复：${weak.map(x=>links[x]?`<a href=${links[x]}>${x}</a>`:x).join('、')}，1天后复测。`:'本轮达标；完成3个原卷迁移题，7天后复测。'};</script></body></html>
