<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第3题修复</title><style>body{background:#f4f7fb;font:16px/1.7 sans-serif;color:#172033}.w{max-width:780px;margin:auto}.c{background:#fff;margin:15px;padding:20px;border-radius:14px;border:1px solid #dbe4ef}.tip{background:#eef2ff;padding:12px}.task{display:block;padding:8px}.btn{background:#1d4ed8;color:#fff;border:0;padding:10px 15px;border-radius:9px}a{color:#1d4ed8}</style></head><body><main class="w"><section class="c"><h1>第3题修复：平行导线与磁场叠加</h1><p>不直接背“同向吸引、反向排斥”，使用可迁移的两步法。</p></section><section class="c"><h2>步骤1：求磁场</h2><div class="tip">把导线A当作磁场源，用右手判断A在B位置产生的磁场方向。</div><label class="task"><input class="t" type="checkbox">我能只画A产生的B</label><h2>步骤2：判受力</h2><div class="tip">把导线B当研究对象，结合B中的电流和A产生的磁场判断F。</div><label class="task"><input class="t" type="checkbox">我能写清研究对象</label></section><section class="c"><h2>相邻变式</h2><p>两平行导线电流反向。请分别画出两导线所在处的磁场和受力，验证它们相互排斥。</p><label class="task"><input class="t" type="checkbox">我已独立画图验证</label><button class="btn" id="save">保存</button><p id="out"></p><p><a href="e4-test.html">返回E4小测</a></p></section></main><script>const k='exam03';document.querySelectorAll('.t').forEach((x,i)=>x.checked=(JSON.parse(localStorage.getItem(k)||'[]'))[i]||false);save.onclick=()=>{let a=[...document.querySelectorAll('.t')].map(x=>x.checked);localStorage.setItem(k,JSON.stringify(a));out.textContent=a.every(Boolean)?'完成；下一步3天后换位置关系复测。':'先完成未勾选步骤。'}</script></body></html>
