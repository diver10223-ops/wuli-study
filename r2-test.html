<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2电路与实验混合小测</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:16px/1.6 sans-serif}.w{max-width:850px;margin:auto}.hero{background:#174395;color:#fff;padding:25px 15px}.c{background:#fff;border:1px solid #dbe4ef;border-radius:14px;margin:15px;padding:18px}.q{padding:15px 0;border-bottom:1px solid #e2e8f0}label{display:block;padding:6px}.b{background:#1d4ed8;color:#fff;border:0;border-radius:9px;padding:10px 16px}.plan{background:#eff6ff;padding:13px;border-left:4px solid #2563eb}.bad{color:#b91c1c}.good{color:#15803d}a{color:#1d4ed8}</style></head><body><header class="hero"><div class="w"><h1>R2 电路与实验混合小测</h1><p>10题 · 不按模型排列 · 提交后生成1/3/7天复测</p></div></header><main class="w"><section class="c" id="quiz"></section><section class="c"><button class="b" id="submit">提交小测</button><div id="result"></div></section><section class="c"><h2>下一步计划</h2><div class="plan" id="plan">完成小测后生成。</div><p><a href="r2.html">← 返回R2</a></p></section></main><script>
const qs=[['滑阻接入电阻增大，外电阻与总电流通常怎样？',['都增大','外阻增大、总电流减小','都减小'],1,'M03'],['电动机输入功率通用式？',['UI','I²r','U²/r'],0,'M04'],['电动机U=8V,I=2A,r=1Ω，机械功率？',['12W','16W','4W'],0,'M04'],['改装大量程电流表应？',['串联大电阻','并联小电阻','并联大电阻'],1,'M05'],['欧姆挡换挡后首先？',['直接读数','重新欧姆调零','机械调零'],1,'E301'],['U-I图纵截距表示？',['内阻','电动势','功率'],1,'E303'],['U-I图斜率绝对值表示？',['内阻','电动势','效率'],0,'E303'],['并联干路3A，一支路1A，另一支路？',['1A','2A','3A'],1,'M03'],['电动机热功率使用哪个电流？',['干路电流','电动机支路电流','任意电流'],1,'M04'],['电压表应接在？',['待测元件两端','干路串联','电源内部'],0,'E301']];quiz.innerHTML=qs.map((q,i)=>`<div class=q><b>${i+1}. ${q[0]}</b>${q[1].map((x,j)=>`<label><input type=radio name=q${i} value=${j}>${x}</label>`).join('')}</div>`).join('');submit.onclick=()=>{let s={},n=0;qs.forEach((q,i)=>{s[q[3]]??=[0,0];s[q[3]][1]++;let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&+a.value===q[2]){s[q[3]][0]++;n++}});let weak=Object.entries(s).filter(x=>x[1][0]/x[1][1]<.8).map(x=>x[0]);let now=Date.now(),days=d=>new Date(now+d*864e5).toLocaleDateString();localStorage.setItem('r2Test',JSON.stringify({score:n,s,weak,reviews:[days(1),days(3),days(7)]}));result.innerHTML=`<h2>${n}/10</h2>${Object.entries(s).map(x=>`<p>${x[0]}：${x[1][0]}/${x[1][1]}</p>`).join('')}<p>复测：${days(1)}、${days(3)}、${days(7)}</p>`;plan.innerHTML=weak.length?`先返回补修：<b>${weak.join('、')}</b>，1天后复测。`:'本轮达标；1、3、7天后用新题复测，暂不标稳定掌握。'};</script></body></html>
